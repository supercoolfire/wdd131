        <h1>Responsive Lazy Loading with Semantic Figures</h1>
        <p>The 6 images below use modern responsive rules wrapped in accessible HTML figures.</p>

        <!-- Image 1 -->
        <figure>
            <div class="image-container">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400'%3E%3C/svg%3E"

            </div>
            <figcaption>Figure 1: Wide mountain range showcasing early morning natural light.</figcaption>
        </figure>
