<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light/Dark Mode Boilerplate</title>
    <link rel="stylesheet" href="boilerplate.css">
    <script src="boilerplate.js" defer></script>
</head>
<body>

    <header>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Switch to dark mode">
            <span class="theme-icon">🌙</span>
            <span class="theme-text">dark Mode</span>
        </button>
        <button id="theme-toggle2" type="button" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
    </header>

    <main>
        <div class="foo bar light">Good morning! It's time to sleep, click that dark mode button</div>  
        <div class="foo bar dark">Good evening! It's time to wake up, click that dark mode button</div>
    </main>

</body>
</html>
